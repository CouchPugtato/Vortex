[package]
name = "vortexctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
wait-timeout = "0.2"

[dev-dependencies]
filetime = "0.2"

[profile.release]
strip = true

[[example]]
name = "service_fixture"
path = "tests/fixtures/runtime.rs"
