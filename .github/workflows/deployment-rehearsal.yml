name: Clean Ubuntu deployment rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths: ['deployment/**', 'src/**', 'config/**', 'Cargo.*', 'build.rs', 'rust-toolchain.toml', '.github/workflows/deployment-rehearsal.yml']
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare VM host
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils jq shellcheck acl
          if test -e /dev/kvm; then sudo setfacl -m u:$(id -un):rw /dev/kvm; fi
          rustup toolchain install 1.96.0 --profile minimal
          shellcheck deployment/rehearsal/run.sh
      - name: Rehearse deployment with outbound networking blocked
        run: bash deployment/rehearsal/run.sh
      - name: Retain rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-rehearsal-evidence
          path: |
            ~/.cache/vortex-vm/run-*/result.json
            ~/.cache/vortex-vm/run-*/rehearsal.log
            ~/.cache/vortex-vm/run-*/serial.log
            ~/.cache/vortex-vm/run-*/qemu.log
            ~/.cache/vortex-vm/run-*/guest-results.tar
          if-no-files-found: warn
